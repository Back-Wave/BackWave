\* TLC checks liveness without symmetry, so the bounds are smaller than in CommitHorizon.cfg.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2}
    Observers = {obs}
    Reporters = {rep}
    OddOnly = {}
    MaxPos = 3
    MaxRowsPerTxn = 2
    MaxRows = 2
    MaxRetries = 1
    ReporterRuns = 1
    Cache = 1
    HorizonOrder = "postgres"
    ProbeMode = "both"
    UseHorizon = TRUE
    RegisterFirst = TRUE
INVARIANTS TypeOK CursorSafe HorizonSafe
PROPERTY Liveness
