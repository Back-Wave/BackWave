# Sample-only infra. Distinct ports + DB name so it never collides with the repo-root
# compose (5499 / backwave_test). Workflow: `docker compose up -d` here, set BackWave:Store,
# then `dotnet run`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: backwave
      POSTGRES_PASSWORD: backwave
      POSTGRES_DB: backwave_sample
    ports:
      - "5398:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backwave -d backwave_sample"]
      interval: 2s
      timeout: 2s
      retries: 30

  # amd64-only image: on Apple Silicon it runs under Rosetta emulation (slow but correct).
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "BackWave!Passw0rd"
    ports:
      - "14331:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'BackWave!Passw0rd' -C -Q 'SELECT 1' -b"]
      interval: 5s
      timeout: 5s
      retries: 60
